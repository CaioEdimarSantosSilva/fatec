{% extends 'template.html' %}

{% block titulo %}Alterar senha{% endblock %}

{% block conteudo %}

<div class="dash-header">
    <div>
        <span class="section-label">Minha conta -> Segurana</span>
        <h1>Alterar senha</h1>
    </div>
    <a href="{% url 'perfil' %}" class="btn-ghost-sm">Voltar</a>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar nova senha</button>
    </form>
</div>

{% endblock %}
