{% extends 'template.html' %}

{% block titulo %}Contato{% endblock %}

{% block conteudo %}

<div class="page-intro">
    <span class="section-label">Fale conosco</span>
    <h1>Envie uma mensagem</h1>
    <p>Tem alguma dúvida, sugestão ou problema com uma compra? Preencha o formulário abaixo.</p>
</div>

<div class="form-card form-card--centered">
    <form action="{% url 'addcontato' %}" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Enviar mensagem">
    </form>
</div>

{% endblock %}
