{% extends 'template.html' %}

{% block titulo %}Login{% endblock %}

{% block conteudo %}

<div class="form-card form-card--centered">
    <h1>Entrar</h1>

    {% if erro %}
        <div class="alert alert-error">{{ erro }}</div>
    {% endif %}

    <form action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <label for="username">Usuário</label>
        <input type="text" name="username" id="username" placeholder="Seu usuário" required>

        <label for="password">Senha</label>
        <input type="password" name="password" id="password" placeholder="Sua senha" required>

        <button type="submit">Entrar</button>
    </form>

    <p class="form-footnote">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>

{% endblock %}
